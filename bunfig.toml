# Bun test configuration for this repository.
# The TokenMeter render-level harness mounts @opentui elements in a headless
# test renderer; the preload swaps solid-js's non-reactive server build for
# the client build (which is also required for the Solid JSX transform).
[test]
preload = ["@opentui/solid/preload"]

# Coverage policy: effective 80/80/80 (statements/functions/lines) per
# instrumented source file. Bun 1.3.11 applies coverageThreshold per file and
# has no branch coverage metric — the three supported metrics are statements,
# functions and lines. `dist/**` is excluded because it is a generated bundle
# (regenerated by build; artifact tests exercise only its module shape).
coverageThreshold = { statements = 0.8, functions = 0.8, lines = 0.8 }
coveragePathIgnorePatterns = ["dist/**"]
